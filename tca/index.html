<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1420">
<title>Traumatic Cardiac Arrest &mdash; {{SITE.title}}</title>
<meta name="description" content="Traumatic cardiac arrest cognitive aid: the decision to start, then the sequence one step at a time. Personal aid, not hospital policy.">
<link rel="canonical" href="https://{{SITE.domain}}/tca/">
<style>
/* ===== SITE CONFIG (site-specific — edit to localize) =====
   Colors and type are the design language of the cognitive aid this tool is a
   port of. The one clinical number on this screen is the arrest window in the
   first stop criterion; it is ARREST_WINDOW_MIN in the script below. */
:root{--bg:#0D1420;--card:#161F2E;--card2:#1D2A3C;--ink:#EAF0F7;--ink2:#8FA0B5;
      --line:rgba(255,255,255,.10);--accent:#2FA372;--accentInk:#fff;--red:#E5484D;
      --gray:#5C6B7E;--blue:#4C8DDA;--green:#3DA35D;--amber:#F0B429;
      --sans:'Source Sans 3',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
body[data-theme="light"]{--bg:#EFF2F5;--card:#FFFFFF;--card2:#F4F6F9;--ink:#141E2B;--ink2:#5A6A7D;
      --line:rgba(15,35,60,.13);--accent:#00693E;--red:#C63238;--gray:#6B7A8D;--blue:#2F6FB5;
      --green:#1F7F49;--amber:#B07E13}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.wrap{min-height:100vh;background:var(--bg)}
.inner{max-width:680px;margin:0 auto;padding:0 14px 40px}
.bar{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 10px;
     display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.kick{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.clock{font-family:var(--mono);font-size:26px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.4s infinite;display:inline-block}
.phase{font-size:12px;color:var(--ink2);font-weight:600}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink2);
      font:700 11px var(--sans);letter-spacing:.08em;padding:9px 12px;border-radius:10px;cursor:pointer;min-height:38px}
.card{margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em}
.title{font-size:20px;font-weight:800;line-height:1.3;margin:8px 0 2px;text-wrap:pretty}
.sub{font-size:14px;color:var(--ink2);line-height:1.45}
.big{width:100%;border:none;border-radius:12px;color:#fff;font:800 17px var(--sans);
     cursor:pointer;min-height:64px;margin-top:14px;padding:0 16px}
.alt{width:100%;margin-top:8px;min-height:60px;border:1px solid var(--line);border-radius:12px;
     background:var(--card2);color:var(--ink);font:800 16px var(--sans);cursor:pointer;text-align:left;padding:0 18px}
.quiet{width:100%;margin-top:8px;min-height:52px;border:1px solid var(--line);border-radius:12px;
       background:var(--card2);color:var(--ink2);font:700 14px var(--sans);cursor:pointer}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
         min-height:54px;margin-top:10px;padding:0 14px;border:1px solid var(--line);border-radius:12px;
         background:var(--card2);color:var(--ink);font:700 15px var(--sans);cursor:pointer;text-align:left}
.stoprow{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;
         padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);
         color:var(--ink);font:700 15.5px var(--sans);cursor:pointer}
.stoprow[aria-pressed="true"]{border-color:var(--red);background:rgba(229,72,77,.12)}
.box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);
     display:inline-flex;align-items:center;justify-content:center;font:800 15px var(--sans);color:#fff}
.stoprow[aria-pressed="true"] .box{border-color:var(--red);background:var(--red)}
.num{display:flex;gap:10px;font-size:15px;line-height:1.4;margin-top:8px}
.num b{font-family:var(--mono);font-weight:700;color:var(--red);flex:none}
.pill{background:var(--accent);color:var(--accentInk);border-radius:999px;padding:9px 18px;
      font-size:14px;font-weight:800;letter-spacing:.06em}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(4,8,14,.72);display:flex;align-items:flex-end}
.sheetin{background:var(--card);width:100%;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
.trail{font-family:var(--mono);font-size:12.5px;color:var(--ink2);display:flex;gap:10px;margin-top:6px}
.disc{margin-top:22px;font-size:11.5px;line-height:1.5;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}
/* ACCESSIBILITY.md: the running-case dot is the only animation on this page,
   and it must hold still for anyone who asks the OS to stop motion. It still
   reads as "running" because it stays solid red. */
@media (prefers-reduced-motion: reduce){
  .dot{animation:none}
  *{transition:none !important;scroll-behavior:auto !important}
}
@media print{.bar,.chip,.big,.alt,.quiet,.linkrow{display:none}}
</style>
</head>
<body data-theme="dark">
<div class="wrap"><div class="inner">

<div class="bar">
  <div style="flex:1;min-width:0">
    <div class="kick">TRAUMATIC CARDIAC ARREST</div>
    <div style="display:flex;align-items:baseline;gap:8px">
      <span class="clock" id="clock">0:00</span>
      <span class="dot" id="dot" style="display:none"></span>
      <span class="phase" id="phase">DECIDE</span>
    </div>
  </div>
  <button class="chip" id="themebtn" type="button">LIGHT</button>
  <button class="chip" id="resetbtn" type="button">RESET</button>
</div>

<h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Traumatic Cardiac Arrest</h1>

<div id="screen"></div>

<div class="disc" id="disc"></div>
</div></div>

<div id="sheetwrap"></div>

<script>
/* =============================================================================
   Traumatic Cardiac Arrest — a direct port of the cognitive aid, and nothing
   else. The decision to start comes first; then the sequence, one step on
   screen at a time, because a clinician doing a procedure they may never have
   done should not be reading past four steps they already did to find the one
   they are on.

   Deliberately self-contained (CLAUDE.md rule 1): inline CSS and JS, no
   external dependencies, works offline.

   NO PHI (rule 3). The event trail holds times and the labels below — never a
   name, a number, or anything typed about a patient — and RESET clears it.
   ========================================================================== */
var VERSION='1.0.0', REVIEWED='2026-08-21';
/* The one localizable clinical number on this screen. */
var ARREST_WINDOW_MIN=15;

var STOPS=[
  'Lost vitals before the last '+ARREST_WINDOW_MIN+' minutes',
  'Obvious non-survivable injury',
  'Mass casualty incident',
  'No surgical support for this'
];

var SHEETS={
    airway:{k:'PROCEDURE',t:'Advanced airway — iGel or intubate',l:[
      'iGel is the faster choice with one operator and a bloody field. Size by weight, lube the back, insert to hard stop.',
      'Intubating: suction first. Two large-bore rigid suctions, SALAD technique — suction the airway, then the tube follows the suction catheter down.',
      'Bougie loaded on the first attempt. Video if the blood lets you see.',
      'Confirm with waveform capnography. Absent ETCO₂ in arrest is not proof of misplacement — look, and check depth.',
      'Secure it and hand ventilation to one named person. 10 breaths/min, do not bag hard — you will drop the preload further.']},
    finger:{k:'PROCEDURE',t:'Finger thoracostomy — bilateral',l:[
      'Arm abducted. 5th intercostal space, anterior to mid axillary line, at nipple level.',
      '4–5 cm transverse incision through skin and subcutaneous tissue.',
      'Blunt dissect over the top of the rib with a clamp, then push through the pleura — expect a rush of air or blood.',
      'Sweep a finger 360° for lung, clot, and diaphragm. Feel for a hole.',
      'Do the other side. Both sides, every time, before you conclude the chest is not the problem.',
      'Massive blood out on either side is a thoracotomy conversation, not a chest tube conversation.']},
    thor:{k:'PROCEDURE',t:'Resuscitative thoracotomy',l:[
      'Indication: penetrating torso injury with signs of life in the last ~15 min, or blunt arrest with witnessed loss under ~10 min and a surgeon.',
      'Left anterolateral incision in the 5th intercostal space, above rib 5, from sternum to the table.',
      'Cut through intercostals with scissors, spread with a rib spreader or Finochietto — handle down.',
      'Open the pericardium longitudinally, anterior to the phrenic nerve. Evacuate clot.',
      'Deliver the heart. Look at every surface, including the back.',
      'Descending aorta cross-clamp only if you need it for abdominal or pelvic bleeding — it buys minutes, not hours.']},
    cardiac:{k:'PROCEDURE',t:'Close the heart',l:[
      'Finger first. Direct pressure on the hole stops the bleeding while you set up.',
      'Foley — 16 Fr through the wound, balloon up with 5–10 mL saline, gentle traction, clamp the port. Do not pull it through the myocardium. Good for ventricular holes.',
      'Skin stapler — fastest for a linear ventricular laceration in a bleeding field. Staples across the defect, perpendicular.',
      'Pledgeted suture — 2-0 or 3-0 non-absorbable, horizontal mattress over pledgets. The definitive answer for atrium and for anything near a coronary.',
      'Near a coronary: pass the suture underneath the vessel, never through it.',
      'Atrium: a side-biting clamp or a purse string is often quicker than pledgets.']},
    hilar:{k:'PROCEDURE',t:'Hilar twist — pulmonary laceration',l:[
      'For massive unilateral pulmonary haemorrhage or air embolism from a deep lung injury.',
      'Divide the inferior pulmonary ligament first — the lung will not rotate without it.',
      'Rotate the lung 180° anteriorly and superiorly around the hilum. Clockwise on the right, anticlockwise on the left.',
      'This kinks the hilar vessels and bronchus — bleeding stops, ventilation to that lung stops.',
      'Alternative: clamp the whole hilum with a vascular clamp, or compress it in your hand.',
      'This is a bridge to the OR. Note the time — the lung is ischaemic from now.']},
    post:{k:'REFERENCE',t:'Post-ROSC care after TCA',l:[
      'Keep the blood going. Ongoing transfusion, 1:1:1, warm it.',
      'Correct the lethal triad — temperature, calcium, pH. Check ionised calcium after every few units.',
      'Permissive hypotension until surgical control, unless there is a head injury.',
      'TXA if within 3 hours and not already given.',
      'Definitive imaging only if it does not delay the OR.',
      'Sedate and paralyse if needed. Reassess the chest and the thoracostomies before you move.']},
    tq:{k:'PROCEDURE',t:'Tourniquet application',l:[
      'High and tight if the wound is a mess, otherwise 5–8 cm proximal of the laceration — never over a joint.',
      'Wide windlass device over clothing is fine. Skin contact is not required.',
      'Twist the windlass until the bleeding stops and the distal pulse is gone. Pain means it is probably working.',
      'Lock the windlass, write the time on the strap, and say it out loud for the record.',
      'Still bleeding? Second tourniquet immediately proximal to the first.',
      'Do not loosen it to check. It comes off in the OR.']},
    binder:{k:'PROCEDURE',t:'Pelvic binder application',l:[
      'Center on the greater trochanters, not the iliac crests. Too high does nothing.',
      'Log roll or slide it under — one movement, then stop moving the pelvis.',
      'Pull both ends until snug and fasten. You want reduction, not compression injury.',
      'Empty the pockets and remove hard objects underneath first.',
      'Reassess for external bleeding after it is on, and check the film if you have one.',
      'It is a temporary measure for an unstable pelvis in a bleeding patient — the answer is still blood and a surgeon.']},
    debrief:{k:'AFTER',t:'Team debrief',l:[
      'Do it now, in the room, before anyone leaves. Five minutes is enough.',
      'Name what happened, plainly, with the timeline you just logged.',
      'What went well — say it specifically and by role.',
      'What was hard, or slow, or missing — equipment, access, blood, communication.',
      'One thing we change next time. Only one, and give it an owner.',
      'Check on the people in the room. Name that this was a hard one and point to the support that exists.',
      'Send the event log and anything that needs fixing to the department for follow-up.']},
    or:{k:'DISPOSITION',t:'Prepare for OR or transfer',l:[
      'Call the surgeon back and state the injury, what you did, and what is holding.',
      'Blood travels with the patient. Confirm units, warmer, and a pump.',
      'Cover the open chest, keep the retractor in, do not close.',
      'One named person owns the airway and one owns the transfusion for the move.',
      'If transferring out: accepting surgeon on the phone, transport with blood, and send the record you just built.']}};

var S={phase:'decide',stops:[false,false,false,false],start:null,step:'say',
       events:[],xDone:false,sheet:null,resetArm:false,stopAt:null,lifeAt:null,theme:'dark'};

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function clock(){ return S.start ? fmt((Date.now()-S.start)/1000) : '0:00'; }
/* A time of death is a real time that gets written in a chart and said out
   loud to a room — never "58 seconds after we started". The case trail below
   stays elapsed, because that is what a debrief reasons about; only the moment
   the resuscitation was called is absolute. */
function wallClock(){
  var d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function log(label){ S.events.unshift({t:clock(),label:label}); }
/* Named toTop, not top: `top` is window.top and redeclaring it is a
   SyntaxError that kills the whole script silently. */
function toTop(){ try{ window.scrollTo(0,0); document.documentElement.scrollTop=0; }catch(e){} }
function go(step,label){ if(label) log(label); S.step=step; paint(); toTop(); }

function numbered(list){
  var h=''; for(var i=0;i<list.length;i++){ h+='<div class="num"><b>'+(i+1)+'</b><span>'+list[i]+'</span></div>'; }
  return h;
}
function linkRow(id,label){
  return '<button class="linkrow" type="button" data-sheet="'+id+'"><span>'+label+'</span><span style="color:var(--ink2)">\u203a</span></button>';
}
function stepCard(color,n,head,title,sub,body,actions){
  return '<div class="card" style="border-color:var('+color+')">'+
    '<div class="eyebrow" style="color:var('+color+')">STEP '+n+' \u00b7 '+head+'</div>'+
    '<div class="title">'+title+'</div>'+
    (sub?'<div class="sub">'+sub+'</div>':'')+(body||'')+actions+'</div>';
}
/* act is either a destination step id plus the note to log ("dest|note"), or
   one of the terminal actions the handler owns (lifeyes / lifeno). Keeping the
   two distinguishable here is what stopped a renumber from silently pointing a
   step's advance button back at itself. */
function bigBtn(color,label,sub,act){
  var attr;
  if(act.indexOf('|')>-1){ var q=act.split('|'); attr='data-step="'+q[0]+'" data-note="'+q[1]+'"'; }
  else attr='data-go="'+act+'"';
  return '<button class="big" style="background:var('+color+');text-align:'+(sub?'left':'center')+'" '+attr+'>'+label+
    (sub?'<div style="font-size:13px;font-weight:600;opacity:.85;margin-top:4px">'+sub+'</div>':'')+'</button>';
}

function renderDecide(){
  var rows='';
  for(var i=0;i<STOPS.length;i++){
    rows+='<button class="stoprow" type="button" data-stop="'+i+'" aria-pressed="'+(S.stops[i]?'true':'false')+'">'+
          '<span class="box">'+(S.stops[i]?'\u2713':'')+'</span><span>'+STOPS[i]+'</span></button>';
  }
  var any=S.stops.some(Boolean);
  var out=any
    ? '<div style="margin-top:12px;border:1px solid var(--red);border-radius:12px;padding:12px;font-size:14.5px;line-height:1.5">'+
      'One or more stop criteria are checked. This patient is not a candidate for resuscitative thoracotomy \u2014 declare, support the family, and document.</div>'+
      '<button class="big" style="background:var(--gray)" data-go="stophere">DO NOT START \u2014 DECLARE</button>'
    : '<button class="big" style="background:var(--red);min-height:88px;font-size:21px;box-shadow:0 6px 24px rgba(229,72,77,.25)" data-go="proceed">PROCEED \u2014 START TCA'+
      '<div style="font-size:13px;font-weight:600;opacity:.85;margin-top:4px">Starts the clock and the resuscitation sequence</div></button>';
  return '<div class="card" style="border-color:var(--amber);padding:0;overflow:hidden">'+
    '<div style="display:flex;justify-content:center;padding:14px 16px 0">'+
      '<span style="background:var(--amber);color:#141E2B;font-size:12px;font-weight:800;letter-spacing:.12em;padding:9px 18px;border-radius:999px">DECIDE FIRST</span></div>'+
    '<div style="padding:12px 16px 16px">'+
      '<div style="font-size:22px;font-weight:800;line-height:1.25;margin:0 0 4px;text-wrap:pretty">Should I start a code on this trauma patient?</div>'+
      '<div style="font-size:14px;color:var(--ink2);margin-bottom:12px">If <b style="color:var(--ink)">yes to any</b> of these, stop.</div>'+
      '<div style="display:grid;gap:8px">'+rows+'</div>'+out+
    '</div></div>';
}

function renderStep(){
  var st=S.step, h='';
  if(st==='say'){
    h=stepCard('--red','1','STATE IT OUT LOUD','\u201cThis is Traumatic Cardiac Arrest\u201d','',
      '<div style="font-size:16px;font-weight:600;line-height:1.45;color:var(--ink);border-left:3px solid var(--red);padding-left:12px;margin-top:10px;text-wrap:pretty">'+
      '\u201cWe are not doing normal ACLS, we are resuscitating with blood, looking for immediate reversible injuries, then we will stop if we can\u2019t find any\u201d</div>',
      '<button class="big" style="background:var(--accent)" data-step="organize" data-note="Declared \u2014 not normal ACLS">SAID IT \u2014 LOG IT</button>');
  } else if(st==='organize'){
    /* ORGANIZE is roles only. Controlling the bleeding you can see is its own
       step below it, because it is a thing somebody does with their hands, not
       a thing the team agrees on. */
    h='<div class="card" style="border-color:var(--accent)">'+
      '<div class="eyebrow" style="color:var(--accent)">STEP 2 \u00b7 ORGANIZE</div>'+
      '<div class="title">Get Organized</div>'+
      '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px">'+
        '<span class="pill">ACCESS</span><span class="pill">AIRWAY</span><span class="pill">BLOOD/FLUIDS</span>'+
        '<span class="pill">EQUIPMENT</span><span class="pill">WHAT ELSE?</span></div>'+
      '<button class="big" style="background:var(--accent)" data-step="bleeding" data-note="Organized">GET ORGANIZED</button></div>';
  } else if(st==='bleeding'){
    h='<div class="card" style="border-color:var(--red)">'+
      '<div class="eyebrow" style="color:var(--red)">STEP 3 \u00b7 CONTROL EXTERNAL BLEEDING</div>'+
      '<div class="title">Stop what you can see</div>'+
      '<div class="sub">Pressure, tourniquet, pelvic binder. Blood on the floor is blood you can still keep.</div>'+
      '<button class="linkrow" type="button" data-x style="border-color:'+(S.xDone?'var(--red)':'var(--line)')+'">'+
        '<span><span style="font-family:var(--mono);font-size:20px;font-weight:700">X</span> '+
        (S.xDone?'Catastrophic haemorrhage controlled \u2713':'Catastrophic haemorrhage \u2014 control it now')+'</span></button>'+
      linkRow('tq','Tourniquet card')+linkRow('binder','Pelvic binder card')+
      '<button class="big" style="background:var(--red)" data-step="airway" data-note="External bleeding controlled">BLEEDING CONTROLLED \u2014 LOG IT</button></div>';
  } else if(st==='airway'){
    h=stepCard('--blue','4','ADVANCED AIRWAY','iGel or intubate',
      'Fastest definitive airway wins. Do not pause the rest of the sequence for it.',
      linkRow('airway','SALAD / intubation card'),
      '<button class="big" style="background:var(--blue)" data-step="fnt" data-note="Airway in">AIRWAY IN \u2014 LOG IT</button>');
  } else if(st==='fnt'){
    h=stepCard('--red','5','FINGER THORACOSTOMY','Both sides \u2014 5th ICS, anterior axillary line',
      'Decompresses tension physiology and tells you what the chest holds.',
      linkRow('finger','Finger thoracostomy card'),
      '<button class="big" style="background:var(--red)" data-step="thor" data-note="Both thoracostomies done">BOTH SIDES DONE \u2014 LOG IT</button>');
  } else if(st==='thor'){
    h=stepCard('--red','6','CONSIDER OPEN THORACOTOMY','Left anterolateral, above rib 5',
      'Penetrating torso injury with recent signs of life is the strongest indication.',
      linkRow('thor','Resuscitative thoracotomy card'),
      '<button class="big" style="background:var(--red);min-height:68px;font-size:18px" data-step="heart" data-note="Chest open">CHEST OPEN \u2014 LOG IT</button>'+
      '<button class="quiet" type="button" data-step="life" data-note="Checking for signs of life">NOT INDICATED \u2014 SKIP TO SIGNS OF LIFE</button>');
  } else if(st==='heart'){
    h=stepCard('--red','7','DELIVER THE HEART','Open the pericardium, deliver the heart','',
      numbered(['Nick pericardium with scalpel',
                'Longitudinal incision with scissors anterior to the phrenic nerve',
                'Deliver the heart into your hands',
                'Look at the heart for signs of injury']),
      '<button class="big" style="background:var(--red);min-height:68px;font-size:18px" data-step="injured" data-note="Heart delivered">HEART DELIVERED \u2014 TIMESTAMP</button>');
  } else if(st==='injured'){
    h=stepCard('--amber','8','IS THE HEART INJURED?','Look at every surface','','',
      bigBtn('--red','INJURED \u2014 CLOSE IT','Foley, staple, or pledgeted suture','close|Heart injured')+
      '<button class="alt" type="button" data-step="other" data-note="Heart intact">HEART INTACT'+
      '<div style="font-size:13px;font-weight:600;color:var(--ink2);margin-top:4px">Move on to other thoracic injury</div></button>');
  } else if(st==='close'){
    h=stepCard('--red','8','CLOSE THE HEART','Pick the fastest thing that holds','',
      linkRow('cardiac','Cardiac repair card \u2014 foley \u00b7 staple \u00b7 pledgeted suture'),
      '<button class="big" style="background:var(--accent)" data-step="other" data-note="Cardiac wound repaired">REPAIRED \u2014 LOG IT</button>'+
      '<button class="quiet" type="button" data-step="life" data-note="Cardiac wound not repairable">NOT REPAIRABLE</button>');
  } else if(st==='other'){
    h=stepCard('--amber','9','ANY OTHER THORACIC INJURY YOU CAN REPAIR?','Pulmonary laceration, hilar bleeding, great vessel','',
      linkRow('hilar','Hilar twist card'),
      '<button class="big" style="background:var(--accent)" data-step="side" data-note="Other thoracic injury controlled">CONTROLLED \u2014 LOG IT</button>'+
      '<button class="quiet" type="button" data-step="side" data-note="Nothing else repairable found">NOTHING REPAIRABLE FOUND</button>');
  } else if(st==='side'){
    h=stepCard('--amber','9','THE OTHER SIDE','Was there massive bleeding from the right?',
      'Check the right thoracostomy and the right chest. Blood there is the reason to extend.','',
      bigBtn('--red','YES \u2014 EXTEND TO CLAMSHELL','Cross the sternum, open the right chest','clam|Extending to clamshell')+
      '<button class="alt" type="button" data-step="life" data-note="Right chest dry">NO \u2014 RIGHT CHEST DRY</button>');
  } else if(st==='clam'){
    h=stepCard('--red','9','CLAMSHELL THORACOTOMY','Extend across \u2014 open both chests','',
      numbered(['Mirror the incision on the right \u2014 same 5th ICS, sternum to the table',
                'Divide the sternum transversely with heavy shears or a Lebsche knife',
                'Lift the anterior chest wall up like a book \u2014 both pleural cavities open',
                'Find and clamp both internal mammary arteries \u2014 they bleed once you have a pressure',
                'Pack, then find the source: hilum, great vessels, lung'])+
      '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">'+
        '<div class="eyebrow" style="color:var(--ink2)">HILAR TWIST \u2014 RIGHT LUNG</div>'+
        numbered(['Divide the inferior pulmonary ligament \u2014 the lung will not rotate without it',
                  'Rotate the lung 180\u00b0 anteriorly and superiorly around the hilum \u2014 clockwise on the right',
                  'Bleeding and ventilation to that lung both stop \u2014 note the time, it is ischaemic from now',
                  'Alternative: clamp the whole hilum, or compress it in your hand'])+
      '</div>'+linkRow('hilar','Full hilar twist card'),
      '<button class="big" style="background:var(--accent)" data-step="life" data-note="Checking for signs of life">CONTROLLED \u2014 LOG IT</button>'+
      '<button class="quiet" type="button" data-step="life" data-note="Checking for signs of life">NOTHING REPAIRABLE</button>');
  } else if(st==='life'){
    h=stepCard('--blue','10','DO YOU HAVE SIGNS OF LIFE?','','',
      '<div style="font-size:14.5px;line-height:1.55;color:var(--ink);margin:8px 0 12px">'+
      'Cardiac motion \u00b7 palpable pulse or measurable BP \u00b7 organized ECG activity \u00b7 pupillary response \u00b7 spontaneous movement or respiratory effort.</div>',
      bigBtn('--green','YES \u2014 SIGNS OF LIFE','TXA \u00b7 calcium \u00b7 MTP \u00b7 post-ROSC care \u00b7 OR or transfer','lifeyes')+
      bigBtn('--gray','NO SIGNS OF LIFE','Terminate the resuscitation','lifeno'));
  }
  return h+renderTrail();
}

function renderLive(){
  return '<div class="card" style="border-color:var(--green)">'+
    '<div class="eyebrow" style="color:var(--green)">SIGNS OF LIFE \u2014 KEEP GOING</div>'+
    '<div class="title">Confirmed at '+S.lifeAt+'</div>'+
    '<button class="linkrow" type="button" data-log="TXA \u2014 1 g IV over 10 min, then 1 g over 8 h">'+
      '<span>TXA \u2014 1 g IV over 10 min, then 1 g over 8 h</span><span style="color:var(--ink2)">LOG</span></button>'+
    '<button class="linkrow" type="button" data-log="Calcium \u2014 1 g CaCl\u2082 IV">'+
      '<span>Calcium \u2014 1 g CaCl\u2082 IV</span><span style="color:var(--ink2)">LOG</span></button>'+
    '<button class="linkrow" type="button" data-log="MTP \u2014 keep the blood going, 1:1:1">'+
      '<span>MTP \u2014 keep the blood going, 1:1:1</span><span style="color:var(--ink2)">LOG</span></button>'+
    linkRow('post','Post-ROSC care card')+linkRow('or','Prepare for OR or transfer')+linkRow('debrief','Team debrief')+
    '<button class="quiet" type="button" data-go="back">BACK TO THE SEQUENCE</button></div>'+renderTrail();
}

function renderStopped(){
  return '<div class="card" style="border-color:var(--gray)">'+
    '<div class="eyebrow" style="color:var(--gray)">RESUSCITATION STOPPED</div>'+
    '<div class="title">Time called: '+S.stopAt+'</div>'+
    '<div style="font-size:14.5px;line-height:1.7;margin-top:10px">'+
      '\u00b7 Say it out loud to the room, and thank them by name<br>'+
      '\u00b7 Notify family \u00b7 medical examiner and organ procurement as applicable<br>'+
      '\u00b7 Document the criteria that stopped the resuscitation<br>'+
      '\u00b7 Debrief the team before they scatter</div>'+
    linkRow('debrief','Team debrief')+'</div>'+renderTrail();
}

function renderTrail(){
  if(!S.events.length) return '';
  var h='<div class="card" style="border-color:var(--line)"><div class="eyebrow" style="color:var(--ink2)">DONE SO FAR</div>';
  for(var i=0;i<S.events.length;i++){
    h+='<div class="trail"><span style="color:var(--ink)">'+S.events[i].t+'</span><span>'+esc(S.events[i].label)+'</span></div>';
  }
  return h+'</div>';
}

function renderSheet(){
  if(!S.sheet){ $('sheetwrap').innerHTML=''; return; }
  var sh=SHEETS[S.sheet]; if(!sh){ $('sheetwrap').innerHTML=''; return; }
  var h='<div class="sheet" data-close><div class="sheetin">'+
    '<div class="eyebrow" style="color:var(--ink2)">'+sh.k+'</div>'+
    '<div class="title" style="font-size:19px">'+sh.t+'</div>';
  for(var i=0;i<sh.l.length;i++){ h+='<div class="num"><b>'+(i+1)+'</b><span>'+sh.l[i]+'</span></div>'; }
  h+='<button class="quiet" type="button" data-close style="margin-top:16px;min-height:56px">CLOSE</button></div></div>';
  $('sheetwrap').innerHTML=h;
}

function paint(){
  $('clock').textContent=clock();
  $('dot').style.display = S.phase==='run' ? '' : 'none';
  $('phase').textContent = S.phase==='decide'?'DECIDE':(S.phase==='run'?'RESUSCITATING':(S.phase==='live'?'SIGNS OF LIFE':'STOPPED'));
  $('themebtn').textContent = S.theme==='dark'?'LIGHT':'DARK';
  $('resetbtn').textContent = S.resetArm?'SURE?':'RESET';
  $('resetbtn').style.background = S.resetArm?'var(--red)':'var(--card)';
  $('resetbtn').style.color = S.resetArm?'#fff':'var(--ink2)';
  document.body.dataset.theme=S.theme;
  var h='';
  if(S.phase==='decide') h=renderDecide();
  else if(S.phase==='run') h=renderStep();
  else if(S.phase==='live') h=renderLive();
  else h=renderStopped();
  $('screen').innerHTML=h;
  renderSheet();
  $('disc').innerHTML='v'+VERSION+' \u00b7 last reviewed '+REVIEWED+' \u00b7 personal/unofficial aid \u2014 '+
    'not part of the hospital IT system or EHR, and not a substitute for clinical judgment. '+
    'Verify every value against local protocol. Nothing here is stored off this device.';
}


document.addEventListener('click', function(e){
  var t=e.target.closest ? e.target.closest('[data-stop]') : null;
  if(t){ var i=+t.getAttribute('data-stop'); S.stops[i]=!S.stops[i]; paint(); return; }
  if(e.target.closest && e.target.closest('[data-x]')){ S.xDone=!S.xDone;
    if(S.xDone) log('Catastrophic haemorrhage controlled'); paint(); return; }
  var sh=e.target.closest ? e.target.closest('[data-sheet]') : null;
  if(sh){ S.sheet=sh.getAttribute('data-sheet'); paint(); return; }
  if(e.target.closest && e.target.closest('[data-close]')){ S.sheet=null; paint(); return; }
  var lg=e.target.closest ? e.target.closest('[data-log]') : null;
  if(lg){ log(lg.getAttribute('data-log')); paint(); return; }
  /* An advance carries its own destination and its own log line, so there is
     no table to keep in step with the screens. Two buttons reach the same step
     for different reasons (heart intact / cardiac wound repaired) and each
     still records what actually happened. */
  var st=e.target.closest ? e.target.closest('[data-step]') : null;
  if(st){ go(st.getAttribute('data-step'), st.getAttribute('data-note')); return; }
  var g=e.target.closest ? e.target.closest('[data-go]') : null;
  if(!g) return;
  var a=g.getAttribute('data-go');
  if(a==='proceed'){ S.phase='run'; S.start=Date.now(); S.step='say'; log('TCA declared \u2014 clock started'); paint(); toTop(); return; }
  if(a==='stophere'){ S.phase='stopped'; S.stopAt=wallClock(); log('Not a candidate \u2014 declared'); paint(); toTop(); return; }
  if(a==='lifeyes'){ S.phase='live'; S.lifeAt=clock(); log('Signs of life \u2014 keep going'); paint(); toTop(); return; }
  if(a==='lifeno'){ S.phase='stopped'; S.stopAt=wallClock(); log('No signs of life \u2014 resuscitation terminated at '+S.stopAt); paint(); toTop(); return; }
  if(a==='back'){ S.phase='run'; S.step='life'; paint(); toTop(); return; }
});

$('themebtn').addEventListener('click', function(){ S.theme = S.theme==='dark'?'light':'dark'; paint(); });
var ra;
$('resetbtn').addEventListener('click', function(){
  if(!S.resetArm){ S.resetArm=true; paint(); clearTimeout(ra); ra=setTimeout(function(){ S.resetArm=false; paint(); },2500); return; }
  clearTimeout(ra);
  S={phase:'decide',stops:[false,false,false,false],start:null,step:'say',events:[],xDone:false,
     sheet:null,resetArm:false,stopAt:null,lifeAt:null,theme:S.theme};
  paint(); toTop();
});

setInterval(function(){ if(S.phase==='run') $('clock').textContent=clock(); }, 500);
paint();
</script>
</body>
</html>
