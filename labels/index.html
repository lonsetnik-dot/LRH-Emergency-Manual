<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#005596">
<title>Cart &amp; Cabinet Labels — LRH Emergency Manual</title>
<meta name="description" content="Printable labels for the code cart, trauma cart, OB/neonatal cart and the supply cabinets. One design language, three formats sized to the hardware that already exists.">
<link rel="canonical" href="https://lrhemergencymanual.net/labels/">
<style>
/* ============================================================================
   SITE CONFIG — everything an adopting ED changes lives in this <style> block
   and in the CART MAP data block near the bottom of this file. No markup edits.

   ---- THE ONE IDEA -------------------------------------------------------
   FORMAT FOLLOWS HARDWARE. The carts here do not have the same label fittings,
   so a single label size cannot spread across them:

     CODE CART   bare drawer fronts, no holders   -> FULL   10 x 3 in, adhesive
     TRAUMA CART slim card slots on the handle    -> SLIM   3.4 x 0.85 in insert
     OB CART     slim card slots (Waterloo)       -> SLIM   3.4 x 0.85 in insert
     CABINETS    flat doors, no holders           -> DOOR   4 x 2.5 in + index

   The design language is constant; the amount of it that fits is not. What
   survives at every size, in this order, is the RULE OF THREE:
       1. colour + number   (which drawer)      - survives to 3 m
       2. the name          (which contents)    - survives to 1 m
       3. a pictogram       (recognise it fast) - survives to 1 m
   Everything beyond that (key fact, sizes, PAR, expiry, QR) is added back only
   where there is physical room. On SLIM labels there is not, so stock moves to
   a single CHECK CARD per cart rather than being repeated per drawer.

   ---- COLOUR -------------------------------------------------------------
   Colour encodes WHERE and nothing else: which drawer, counting down the cart.
   Never severity, never tool identity. It is never the only carrier - every
   label also has a number, a name and a shape, so the whole system still works
   photocopied in black and white.

   Cart identity does NOT need encoding: the carts are already different colours
   in the room (code = red, OB = navy, trauma = tan/orange). Do not spend a
   channel on something the furniture already says.
   ========================================================================== */
:root{
  /* Drawer position colours. Red is excluded on purpose - the code cart is red. */
  --p1:#6f4fa8; --p2:#0f7a86; --p3:#2f62a8; --p4:#8a6011; --p5:#2f7a3f; --p6:#7a3f6d;
  --shelf:#5a6a78;

  /* Broselow bands — copied verbatim from peds/index.html. If one changes, change both. */
  --bz-grey:#5a6a78; --bz-pink:#c96f8c; --bz-red:#9b1c2e; --bz-purple:#6f4fa8;
  --bz-yellow:#8a6d1f; --bz-white:#8a8578; --bz-blue:#2f62a8; --bz-orange:#b45a1f; --bz-green:#2f7a3f;

  --ink:#16324f; --muted:#5a6a78; --paper:#fffefb; --page:#eceff3;
  --line:#d7dde3; --stockbg:#f4f6f8;

  /* Measured from the hardware. Change these if your fittings differ. */
  --full-w:10in;   --full-h:3in;
  --slim-w:3.4in;  --slim-h:0.85in;
  --door-w:4in;    --door-h:2.5in;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page); color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-print-color-adjust:exact; print-color-adjust:exact}
.mono{font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace}

.toolbar{width:10in; max-width:96vw; margin:14px auto 0; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.toolbar a,.toolbar button{font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:12px;
  letter-spacing:.1em; min-height:40px; display:inline-flex; align-items:center; padding:8px 14px; cursor:pointer; text-decoration:none}
.toolbar a{color:var(--ink); border:1px solid #b9c2cc; background:var(--paper)}
.toolbar button{color:var(--paper); background:var(--ink); border:2px solid var(--ink); font-weight:700}

.sheet{width:10.6in; margin:12px auto 30px; background:#fff; box-shadow:0 6px 26px rgba(22,50,79,.22); padding:.3in}
.sheettitle{font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:9pt; font-weight:700;
  letter-spacing:.2em; color:var(--muted); margin:0 0 8pt; display:flex; justify-content:space-between; gap:12pt}
.note{font-size:9.5pt; line-height:1.45; color:var(--muted); margin:9pt 0 0}
.note b{color:var(--ink)}

/* ---------------- FULL 10 x 3 in ---------------- */
.full{width:var(--full-w); height:var(--full-h); display:grid; grid-template-columns:1in 1fr;
  border:1.5pt solid var(--ink); background:var(--paper); margin:0 0 .2in; overflow:hidden; page-break-inside:avoid}
.full .spine{display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; line-height:1}
.full .spine b{font-size:46pt; font-weight:800; letter-spacing:-2pt}
.full .spine i{font-size:7.5pt; font-weight:700; letter-spacing:.14em; margin-top:3pt; font-style:normal}
.full .right{display:grid; grid-template-rows:auto 1fr auto; min-width:0}
.full .hdr{display:flex; align-items:baseline; justify-content:space-between; gap:10pt; padding:7pt 12pt 5pt; border-bottom:1pt solid var(--line)}
.full .hdr h2{margin:0; font-size:21pt; font-weight:800; letter-spacing:-.5pt; line-height:1}
.full .hdr .tag{font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:7.5pt; font-weight:700; letter-spacing:.16em; color:var(--muted); white-space:nowrap}
.full .body{display:grid; grid-template-columns:1.5in 1fr; align-items:center; gap:14pt; padding:6pt 12pt; min-height:0}
.full .pict svg{width:1.35in; height:1.35in; display:block}
.full .big{font-size:15pt; font-weight:800; line-height:1.08; letter-spacing:-.2pt}
.full .sub{font-size:11pt; font-weight:600; color:#3a4550; line-height:1.2; margin-top:4pt}
.sizes{display:flex; gap:7pt; margin-top:6pt; flex-wrap:wrap}
.sizes span{font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:9.5pt; font-weight:700; border:1.5pt solid var(--ink); border-radius:11pt; padding:1pt 8pt}
.full .stock{display:grid; grid-template-columns:.72in 1.55in 1fr .58in; align-items:center; gap:10pt;
  background:var(--stockbg); border-top:1pt solid var(--line); padding:5pt 10pt 5pt 12pt}
.fl{font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:5.9pt; font-weight:700; letter-spacing:.13em; color:var(--muted); display:block}
.par{text-align:center; border:1.5pt solid var(--ink); border-radius:4pt; padding:1pt 0 2pt}
.par b{display:block; font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:14pt; font-weight:800; line-height:1}
.w{border-bottom:1pt solid var(--ink); height:13pt}

/* ---------------- SLIM 3.4 x 0.85 in (drops into existing card holders) ---------------- */
.slimwrap{display:flex; flex-wrap:wrap; gap:.14in}
.slim{width:var(--slim-w); height:var(--slim-h); display:grid; grid-template-columns:.42in 1fr .5in;
  align-items:center; border:1pt solid var(--ink); background:var(--paper); overflow:hidden; page-break-inside:avoid}
.slim .chip{height:100%; display:flex; align-items:center; justify-content:center; color:#fff;
  font-size:17pt; font-weight:800; line-height:1; text-align:center}
.slim .chip.band{font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:8.5pt; letter-spacing:-.2pt; padding:0 1pt}
.slim .nm{padding:0 5pt; min-width:0}
.slim .nm b{display:block; font-size:10.5pt; font-weight:800; line-height:1.05; letter-spacing:-.2pt;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.slim .nm i{display:block; font-style:normal; font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
  font-size:5.6pt; font-weight:700; letter-spacing:.11em; color:var(--muted); margin-top:1pt;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.slim .ic{display:flex; align-items:center; justify-content:center}
.slim .ic svg{width:.42in; height:.42in; display:block}

/* ---------------- DOOR 4 x 2.5 in (cabinets) ---------------- */
.doorwrap{display:flex; flex-wrap:wrap; gap:.18in}
.door{width:var(--door-w); height:var(--door-h); border:1.5pt solid var(--ink); background:var(--paper);
  display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; page-break-inside:avoid}
.door .dh{display:flex; align-items:center; gap:6pt; padding:5pt 8pt; color:#fff}
.door .dh svg{width:.32in; height:.32in; flex:none}
.door .dh b{font-size:12.5pt; font-weight:800; letter-spacing:-.2pt; line-height:1.05}
.door ul{margin:0; padding:5pt 8pt; list-style:none; font-size:8.4pt; line-height:1.42; column-gap:8pt}
.door li{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.door li::before{content:"\25AA\00A0\00A0"; color:var(--muted)}
.door .df{display:flex; justify-content:space-between; align-items:center; gap:6pt; padding:3pt 8pt;
  background:var(--stockbg); border-top:1pt solid var(--line)}

/* ---------------- cart elevation ---------------- */
.elev{display:flex; gap:.34in; align-items:flex-start; flex-wrap:wrap}
.cart{width:3.15in; border:2pt solid var(--ink); padding:.08in; border-radius:5pt}
.cart .surface{height:.3in; background:#e9ecef; border:1pt solid var(--ink); margin-bottom:.08in;
  font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:5.6pt; letter-spacing:.16em;
  color:var(--muted); display:flex; align-items:center; justify-content:center}
.cart .dr{border:1pt solid rgba(0,0,0,.32); margin-bottom:.08in; padding:.05in .05in .05in .22in;
  display:flex; flex-wrap:wrap; gap:.04in; position:relative; min-height:.34in; align-content:center}
.cart .dr .n{position:absolute; left:.02in; top:50%; transform:translateY(-50%);
  width:.17in; height:.17in; border-radius:50%; color:#fff; font-size:6pt; font-weight:800;
  display:flex; align-items:center; justify-content:center}
.cart .mini{background:var(--paper); border:.75pt solid rgba(0,0,0,.4); height:.2in; flex:1 1 auto;
  display:flex; align-items:center; padding:0 .03in; gap:.03in; min-width:.7in; max-width:1.42in}
.cart .mini i{width:.05in; height:.13in; flex:none; display:block}
.cart .mini u{font-size:4.4pt; font-weight:700; text-decoration:none; line-height:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.assign{flex:1 1 3.6in; font-size:9pt; line-height:1.5; min-width:3in}
.assign h3{margin:0 0 5pt; font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:8pt; letter-spacing:.16em; color:var(--muted)}
.assign li{margin-bottom:2pt}
.k{display:inline-block; width:.15in; height:.15in; border-radius:50%; vertical-align:-1.5pt; margin-right:5pt}

/* ---------------- check card ---------------- */
.check{width:5.2in; border:1.5pt solid var(--ink); background:var(--paper); page-break-inside:avoid}
.check h4{margin:0; padding:6pt 9pt; background:var(--ink); color:#fff; font-size:11pt; letter-spacing:-.2pt;
  display:flex; justify-content:space-between; align-items:baseline}
.check h4 span{font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-size:6.6pt; letter-spacing:.14em; font-weight:700; opacity:.9}
.check table{width:100%; border-collapse:collapse; font-size:8.4pt}
.check th{background:var(--stockbg); font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
  font-size:5.9pt; letter-spacing:.12em; color:var(--muted); text-align:left; padding:3pt 6pt; border-bottom:1pt solid var(--line)}
.check td{padding:4pt 6pt; border-bottom:.75pt solid var(--line); vertical-align:middle}
.check td.c{text-align:center; font-family:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; font-weight:800}
.check td .blank{display:block; border-bottom:.75pt solid #9aa4ae; height:11pt; min-width:.7in}
.check .cdot{display:inline-block; width:.11in; height:.11in; border-radius:50%; margin-right:4pt; vertical-align:-.5pt}

@media print{
  body{background:#fff}
  .toolbar,.screenonly{display:none}
  .sheet{width:auto; margin:0; padding:0; box-shadow:none; page-break-after:always}
  .sheet:last-of-type{page-break-after:auto}
  @page{size:letter landscape; margin:.35in}
}
@media (max-width:1100px){
  .sheet{width:auto; padding:12px}
  :root{--full-w:100%; --full-h:auto}
  .full{grid-template-columns:.8in 1fr}
}
</style>
</head>

/* ================================ RENDER ================================ */
var out=[];
function esc(s){ return String(s); }

function fullLabel(d,L){
  return '<div class="full"><div class="spine" style="background:var('+d.c+')"><b>'+d.n+'</b><i>'+
    (d.side?'PANEL':'DRAWER')+'</i></div><div class="right">'+
    '<div class="hdr"><h2>'+esc(L.t)+'</h2><span class="tag">'+esc(L.tag)+'</span></div>'+
    '<div class="body"><div class="pict">'+svg(L.icon)+'</div><div><div class="big">'+esc(L.big)+'</div>'+
    (L.sub?'<div class="sub">'+L.sub+'</div>':'')+
    (L.sizes?'<div class="sizes"><span>'+L.sizes.join('</span><span>')+'</span></div>':'')+
    '</div></div>'+
    '<div class="stock"><div class="par"><span class="fl">PAR</span><b>'+(L.par||'—')+'</b></div>'+
    '<div><span class="fl">EARLIEST EXPIRY</span><div class="w"></div></div>'+
    '<div><span class="fl">CHECKED · INITIALS</span><div class="w"></div></div>'+
    '<div class="qrcell">'+qr(L.t,'.52in')+'</div></div></div></div>';
}
function slimLabel(d,L){
  return '<div class="slim"><div class="chip" style="background:var('+d.c+')">'+d.n+'</div>'+
    '<div class="nm"><b>'+esc(L.t)+'</b><i>'+esc(L.pack||L.tag)+'</i></div>'+
    '<div class="ic">'+svg(L.icon)+'</div></div>';
}

CARTS.forEach(function(cart){
  /* --- elevation --- */
  var rows='';
  cart.drawers.forEach(function(d){
    var minis=d.labels.map(function(L){
      return '<div class="mini"><i style="background:var('+d.c+')"></i><u>'+esc(L.t)+'</u></div>';
    }).join('');
    rows+='<div class="dr"><span class="n" style="background:var('+d.c+')">'+d.n+'</span>'+minis+'</div>';
  });
  var list=cart.drawers.map(function(d){
    return '<li><span class="k" style="background:var('+d.c+')"></span>'+
      (d.shelf?'<b>Shelf '+d.n+'</b> — ':d.side?'<b>Side panel</b> — ':'')+
      d.labels.map(function(L){return esc(L.t);}).join(' · ')+'</li>';
  }).join('');

  out.push('<div class="sheet" id="loc-'+cart.id+'"><div class="sheettitle"><span>'+cart.name.toUpperCase()+
    ' · LABEL PLACEMENT</span><span>FORMAT: '+cart.format.toUpperCase()+'</span></div>'+
    '<div class="elev"><div class="cart" style="background:'+cart.body+'">'+
    '<div class="surface">WORK SURFACE</div>'+rows+'</div>'+
    '<div class="assign"><h3>DRAWER ASSIGNMENT</h3><ul style="margin:0;padding-left:2pt;list-style:none">'+list+'</ul>'+
    '<p class="note">'+cart.note+'</p></div></div></div>');

  /* --- the labels themselves --- */
  if(cart.format==='full'){
    var buf=[], page=[];
    cart.drawers.forEach(function(d){ d.labels.forEach(function(L){ buf.push(fullLabel(d,L)); }); });
    for(var i=0;i<buf.length;i+=2){
      out.push('<div class="sheet"><div class="sheettitle"><span>'+cart.name.toUpperCase()+
        ' · LABELS</span><span>PRINT AT 100% — DO NOT SCALE TO FIT</span></div>'+
        buf.slice(i,i+2).join('')+'</div>');
    }
  } else {
    var slims='';
    cart.drawers.forEach(function(d){ d.labels.forEach(function(L){ slims+=slimLabel(d,L); }); });
    out.push('<div class="sheet"><div class="sheettitle"><span>'+cart.name.toUpperCase()+
      ' · SLIM INSERTS 3.4 × 0.85 in</span><span>PRINT AT 100% — CUT ON THE BORDER</span></div>'+
      '<div class="slimwrap">'+slims+'</div>'+
      '<p class="note screenonly"><b>Why these carry less.</b> A 3.4 × 0.85 in slot cannot hold a key fact, a size '+
      'chart and a stock block as well. What survives is the rule of three — colour + number, name, pictogram. '+
      'The clinical detail is on the wall poster and the phone card; the stock detail is on the cart check card below.</p></div>');

    /* --- one check card per slim cart, replacing per-label stock fields --- */
    var trs='';
    cart.drawers.forEach(function(d){ d.labels.forEach(function(L){
      trs+='<tr><td><span class="cdot" style="background:var('+d.c+')"></span>'+d.n+'</td><td>'+esc(L.t)+
        '</td><td class="c">'+(L.kit?L.kit.length:'—')+'</td><td><span class="blank"></span></td><td><span class="blank"></span></td></tr>';
      /* A kit is checked item by item, not as one line — a zip-lock that is present but missing
         its scissors still reads as 'stocked' if you only tick the tray. */
      if(L.kit && L.loc) trs+='<tr><td></td><td colspan="4" style="padding-left:18pt; font-family:'+
        '\'IBM Plex Mono\',ui-monospace,monospace; font-size:6.2pt; letter-spacing:.1em; color:#5a6a78">'+
        esc(L.loc)+' — '+esc(L.pack||'')+'</td></tr>';
      if(L.kit) L.kit.forEach(function(k){
        trs+='<tr><td></td><td style="padding-left:18pt; color:#5a6a78; font-size:7.8pt">'+k+
          '</td><td class="c" style="font-weight:400">1</td><td></td><td><span class="blank"></span></td></tr>';
      });
    });});
    out.push('<div class="sheet"><div class="sheettitle"><span>'+cart.name.toUpperCase()+
      ' · CHECK CARD</span><span>CART SIDE · ONE PER CART</span></div>'+
      '<div class="check"><h4>'+cart.name+' — stock check<span>LAMINATE · DRY-ERASE</span></h4>'+
      '<div style="display:flex;gap:9pt;align-items:center;padding:6pt 9pt;border-bottom:1pt solid var(--line)">'+
      qr('@check-'+cart.id,'.62in')+'<div style="font-size:8pt;line-height:1.35;color:var(--muted)">'+
      'Scan for the '+cart.name+' section of the manual — drawer contents, cards and checklists.</div></div>'+
      '<table><thead><tr><th>DR</th><th>LABEL</th><th>PAR</th><th>EARLIEST EXPIRY</th><th>CHECKED · INIT</th></tr></thead>'+
      '<tbody>'+trs+'</tbody></table></div>'+
      '<p class="note screenonly"><b>Stock moved here, not dropped.</b> On the code cart the stock fields fit on each '+
      'face. On a slim insert they do not — so instead of shrinking them into illegibility they consolidate into one '+
      'card on the cart side. One sheet, one signature, the whole cart. PAR column is left blank pending the real counts.</p></div>');
  }
});

/* --- cabinets --- */
var doors='';
CABINETS.rows.forEach(function(r){
  doors+='<div class="sheettitle" style="margin-top:10pt"><span>'+r.row+' CABINETS</span><span></span></div><div class="doorwrap">';
  r.items.forEach(function(it){
    doors+='<div class="door"><div class="dh" style="background:var('+it.c+')">'+svg(it.icon)+'<b>'+it.t+'</b></div>'+
      '<ul>'+it.list.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'+
      '<div class="df">'+(QRS[it.t]?qr(it.t,'.42in'):'')+
      '<span class="fl">CHECKED · INITIALS</span><span class="w" style="flex:1"></span></div></div>';
  });
  doors+='</div>';
});
out.push('<div class="sheet" id="loc-room7"><div class="sheettitle"><span>ROOM 7 CABINETS · DOOR LABELS 4 × 2.5 in</span>'+
  '<span>FORMAT: DOOR</span></div>'+doors+
  '<p class="note"><b>'+CABINETS.note+'</b></p>'+
  '<p class="note screenonly">A door label is the one place a contents list earns its space: a closed cupboard hides '+
  'everything, and unlike a drawer there is no handle strip to scan. Same colour code, same icons, same rule of three '+
  '— plus four to six lines of what is actually inside, which is what stops someone opening six doors in a row.</p></div>');

out.push('<div class="sheet screenonly"><div class="sheettitle"><span>WHAT STILL NEEDS YOU</span><span></span></div>'+
 '<p class="note"><b>1. The code cart drawer model disagrees with the app.</b> The app’s cart section lists six drawers '+
 '(Intubation / I.V. Supplies / Medications / Suction / Surgical / Misc). The layout you sent has five, organised as an '+
 'airway escalation ladder. Thirteen Codes cards carry drawer badges pointing at the six-drawer model, so this has to be '+
 'reconciled before any of it is printed. The OB cart matches already; the trauma cart is not modelled in the app at all.</p>'+
 '<p class="note"><b>2. PAR counts.</b> Every one is a placeholder or blank. These are the numbers that make a glance tell '+
 'you the drawer is short, so they matter more than anything else on the stock line.</p>'+
 '<p class="note"><b>3. Cabinet contents.</b> Placeholders throughout — they need a walk-round. Tell me what is behind '+
 'each door and the labels generate themselves from the data block.</p>'+
 '<p class="note"><b>4. Slot dimensions.</b> Slim is set to 3.4 × 0.85 in from the photographs. Measure one real card '+
 'holder on the Waterloo and one on the Flexline — if they differ, that is two variables, not a redesign.</p>'+
 '<p class="note"><b>5. QR codes.</b> Deliberately omitted from slim inserts (no room, and a QR at that size scans badly). '+
 'They belong on the full faces, the check cards and the door labels, and get generated once destinations are fixed.</p></div>');

document.getElementById('out').innerHTML = out.join('');
var b=document.getElementById('printbtn');
if(b) b.addEventListener('click', function(){ window.print(); });
})();
</script>
