<?xml version="1.0" encoding="UTF-8"?>
<!--
  CairnReady Emergency Manual — app icon for the whole manual (add-to-home-screen).
  Referenced by manifest.webmanifest and precached by the root service worker
  (generated into dist/sw.js by build.mjs from the dist file listing, so this
  file being present is what puts it in the offline shell).

  Drawn inside a 512 viewBox with all meaningful content kept within the central
  ~60% so it survives the circular crop applied to "maskable" icons. Same pulse
  motif as ob-neonatal/icon.svg — that one carries a pink neonatal accent to
  tell the two apart on a home screen when both are installed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CairnReady Emergency Manual">
  <title>CairnReady Emergency Manual</title>

  <!-- Full-bleed brand field (theme_color) — extends past the maskable safe zone by design. -->
  <rect width="512" height="512" fill="#16324f"/>

  <!-- Cardiac/pulse trace, the motif used across the manual. -->
  <polyline points="128,268 186,268 206,214 236,318 258,268 302,268 322,238 342,268 384,268"
            fill="none" stroke="#fffefb" stroke-width="19"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Manual-wide accent: gold, matching the WEIGHT chip and severity fills. -->
  <rect x="196" y="140" width="120" height="20" rx="6" fill="#f7d97a"/>
</svg>
